      <button class="lb-prev" id="lbPrev" aria-label="Previous photo">←</button>
      <img id="lbImg" alt="">
      <div class="lb-text"><div id="lbCaption"></div><div class="lb-film" id="lbFilm"></div></div>
      <button class="lb-next" id="lbNext" aria-label="Next photo">→</button>
    </div>
  </main>
</div>
<script src="site.js"></script>
</body>
</html>
