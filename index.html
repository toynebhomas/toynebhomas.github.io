<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thomas Boyne — Photography Portfolio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.4; color: #111; background-color: #fff; display: flex; }
    nav { width: 240px; height: 100vh; position: fixed; top: 0; left: 0; padding: 30px 20px; background: #fff; border-right: 1px solid #eaeaea; overflow-y: auto; }
    nav h1 { font-size: 13px; font-weight: 500; margin-bottom: 25px; }
    nav h1 a { color: #111; text-decoration: none; }
    .nav-section { margin-bottom: 25px; }
    .nav-section ul { list-style: none; }
    .nav-section ul li { margin-bottom: 4px; }
    .nav-section ul li a { color: #555; text-decoration: none; transition: color 0.2s ease; }
    .nav-section ul li a:hover { color: #111; }
    main { margin-left: 240px; padding: 40px; width: calc(100% - 240px); max-width: 1200px; }
    .category-section { margin-bottom: 60px; }
    .category-title { font-size: 13px; font-weight: 500; margin-bottom: 15px; color: #111; text-transform: lowercase; }
    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    .photo-grid img { width: 100%; height: auto; display: block; object-fit: cover; background-color: #f4f4f4; }
    .photo-grid img.featured-photo { grid-column: 1 / -1; max-height: 80vh; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      nav { position: relative; width: 100%; height: auto; border-right: none; border-bottom: 1px solid #eaeaea; padding: 20px; }
      main { margin-left: 0; width: 100%; padding: 20px; }
      .photo-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav>
    <h1><a href="#">Thomas Boyne</a></h1>
    <div class="nav-section">
      <ul>
        <li><a href="#in-the-city">in the city</a></li>
        <li><a href="#above-the-clouds">above the clouds</a></li>
        <li><a href="#out-of-the-city">out of the city</a></li>
        <li><a href="#way-out-of-the-city">way out of the city</a></li>
        <li><a href="#guatemala">guatemala</a></li>
        <li><a href="#utah">utah</a></li>
        <li><a href="#washington">washington</a></li>
        <li><a href="#california">california</a></li>
      </ul>
    </div>
    <div class="nav-section">
      <ul>
        <li><a href="#information">Information</a></li>
        <li><a href="https://instagram.com" target="_blank">Instagram</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <section id="in-the-city" class="category-section">
      <h2 class="category-title">in the city</h2>
      <div class="photo-grid">
        <img src="https://picsum.photos/1200/800" alt="Sample" class="featured-photo" loading="lazy">
        <img src="https://picsum.photos/600/400" alt="Sample" loading="lazy">
        <img src="https://picsum.photos/600/401" alt="Sample" loading="lazy">
      </div>
    </section>
  </main>
</body>
</html>
